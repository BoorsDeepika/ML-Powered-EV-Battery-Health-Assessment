{% extends "base.html" %}
{% block title %}Login - EV Battery Predictor{% endblock %}
{% block content %}
<section class="form-section">
    <h2>Login</h2>
    <form method="POST" action="{{ url_for('user_login') }}" class="app-form">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>

        <button type="submit" class="btn btn-primary">Login</button>
    </form>
    <p class="form-footer">Don't have an account? <a href="{{ url_for('user_registration') }}">Register here</a></p>
</section>
{% endblock %}
